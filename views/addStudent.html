<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        form { background: #1e293b; padding: 30px; border-radius: 10px; width: 300px; display: flex; flex-direction: column; gap: 15px; }
        input { padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px; background: #38bdf8; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <form id="addForm">
        <h3>➕ Add New Student</h3>
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="text" id="course" placeholder="Course Name" required>
        <input type="number" id="age" placeholder="Age" required>
        <input type="email" id="email" placeholder="Email" required>
        <button type="submit">Register Student</button>
        <a href="home.html" style="color: gray; text-align: center; font-size: 12px; text-decoration: none;">Cancel</a>
    </form>

    <script>
        document.getElementById("addForm").onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById("name").value,
                course: document.getElementById("course").value,
                age: document.getElementById("age").value,
                email: document.getElementById("email").value
            };

            const res = await fetch("https://skillbridge-backend-7quv.onrender.com/students", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            if(res.ok) { alert("Student Added!"); window.location.href = "students.html"; }
        };
    </script>
</body>
</html>
