<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Students | SkillBridge Pro</title>
    <style>
        body { 
            background: #0f172a; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 40px; 
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td { 
            padding: 15px; 
            text-align: left; 
            border-bottom: 1px solid #334155; 
        }
        th { 
            background: #334155; 
            color: #38bdf8;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        tr:hover {
            background: #2d3748;
        }
        .back-btn { 
            color: #38bdf8; 
            text-decoration: none; 
            display: inline-block; 
            margin-bottom: 20px; 
            font-weight: bold;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
        .status-msg {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Back to Dashboard</a>
        
        <h2>🎓 Registered Students</h2>
        <p>Viewing all students currently enrolled in the system.</p>

        <table id="studentTable">
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="4" class="status-msg">Loading students...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadStudents() {
            const body = document.getElementById("tableBody");
            
            try {
                // Fetch from the API
                const res = await fetch("/api/students");
                
                if (!res.ok) throw new Error("Failed to fetch data");

                let result = await res.json();
                
                /**
                 * SAFETY FIX: 
                 * If for some reason the backend sends { success: true, data: [...] } 
                 * instead of just [...], this line will find the array automatically.
                 */
                const studentsArray = Array.isArray(result) ? result : result.data;

                // If no students exist
                if (!studentsArray || studentsArray.length === 0) {
                    body.innerHTML = "<tr><td colspan='4' class='status-msg'>No students found. Add some first!</td></tr>";
                    return;
                }

                // Map the data into table rows
                body.innerHTML = studentsArray.map(s => `
                    <tr>
                        <td style="font-family: monospace; color: #94a3b8;">
                            #${s._id ? s._id.substring(s._id.length - 6) : 'N/A'}
                        </td>
                        <td style="font-weight: 600;">${s.name || "Unknown"}</td>
                        <td>
                            <span style="background: #0ea5e9; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem;">
                                ${s.course || 'General'}
                            </span>
                        </td>
                        <td>${s.email || "No Email"}</td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error("Fetch Error:", error);
                body.innerHTML = `<tr><td colspan="4" class="status-msg" style="color: #ef4444;">❌ Error: ${error.message}</td></tr>`;
            }
        }

        window.onload = loadStudents;
    </script>
</body>
</html>
